<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trivia Live - Control Espectador</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: transparent; /* Fondo transparente para ventanas flotantes */
            color: #ffffff;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow: hidden; /* Evita que la pantalla haga scroll nativo al arrastrar */
        }
        
        /* WIDGET MAESTRO QUE CONTIENE TODO JUNTO */
        #widget-maestro {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1);
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 250px; /* Exactamente la mitad de los 500px anteriores */
            cursor: grab;
            user-select: none;
            touch-action: none; /* Desactiva gestos nativos para poder hacer zoom con los dedos */
        }

        #widget-maestro:active { cursor: grabbing; }

        .drag-handle {
            width: 40px; height: 4px; background: rgba(255, 255, 255, 0.4); 
            border-radius: 4px; margin: 0 auto 5px auto;
        }

        .container {
            width: 100%; background: rgba(26, 26, 30, 0.95); backdrop-filter: blur(8px);
            padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8); box-sizing: border-box;
        }

        h2 { color: #00e676; margin: 0 0 8px 0; font-size: 14px; text-transform: uppercase; text-align: center;}
        
        input {
            width: 100%; padding: 9px; margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px;
            background-color: rgba(37, 37, 42, 0.9); color: #fff; font-size: 11px; 
            box-sizing: border-box; text-align: center; text-transform: uppercase;
        }
        input:focus { border-color: #00e676; outline: none; }
        
        .btn-grid { display: flex; flex-direction: column; gap: 8px; }
        
        .btn {
            width: 100%; padding: 12px; font-size: 14px; font-weight: bold;
            border: none; border-radius: 6px; cursor: pointer; color: #fff;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.6); transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-a { background-color: rgba(255, 23, 68, 0.9); border: 2px solid #d50000; }
        .btn-b { background-color: rgba(41, 121, 255, 0.9); border: 2px solid #2962ff; }
        .btn-c { background-color: rgba(255, 145, 0, 0.9); border: 2px solid #ea8000; }
        
        .grid-avatares { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 5px;}
        .btn-avatar { 
            background: rgba(37, 37, 37, 0.9); border: 1px solid rgba(255,255,255,0.2); 
            padding: 8px; border-radius: 6px; color: white; font-size: 9px; 
            font-weight: bold; cursor: pointer;
        }
        
        #estado { margin-top: 8px; font-size: 9px; color: #aaa; text-align: center; font-weight: bold;}
        #panel-juego { display: none; }
        
        /* CAJA DE PREGUNTA REDUCIDA A LA MITAD */
        #caja-pregunta {
            background: rgba(26, 26, 30, 0.95); padding: 10px; border-radius: 10px;
            border: 2px solid #25f4ee; width: 100%;
            box-shadow: 0 4px 10px rgba(37, 244, 238, 0.3);
            display: none; box-sizing: border-box; backdrop-filter: blur(8px);
        }
        #ctrl-pregunta { color: #fff; font-size: 11px; text-align: center; margin: 0 0 8px 0; }
        .opciones-lista div {
            font-size: 10px; color: #ddd; margin-bottom: 5px;
            background: rgba(255,255,255,0.05); padding: 6px; border-radius: 5px; font-weight: bold;
        }
        .timer-bg { width: 100%; height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 8px; border: 1px solid #000; }
        #ctrl-timer-bar { width: 100%; height: 100%; background: #00e676; transition: width 0.1s linear; }
        #mi-avatar-control { font-size: 30px; text-align: center; margin-bottom: 2px; animation: latido 1.5s infinite alternate; }
        @keyframes latido { from { transform: scale(0.95); } to { transform: scale(1.05); } }
    </style>
</head>
<body>

    <!-- TODO ENVUELTO EN EL WIDGET MAESTRO FLOTANTE -->
    <div id="widget-maestro">
        <div class="drag-handle"></div>

        <!-- CAJA DE PREGUNTA -->
        <div id="caja-pregunta">
            <h3 id="ctrl-pregunta">¿La pregunta aparecerá aquí?</h3>
            <div class="timer-bg"><div id="ctrl-timer-bar"></div></div>
            <div class="opciones-lista">
                <div id="ctrl-opt-a">A) Opción</div>
                <div id="ctrl-opt-b">B) Opción</div>
                <div id="ctrl-opt-c">C) Opción</div>
            </div>
        </div>

        <!-- PANEL DE CONTROL -->
        <div class="container">
            <h2>🎮 TRIVIA LIVE</h2>
            
            <div id="panel-registro">
                <p style="color: #aaa; font-size: 10px; margin: 0 0 5px 0; text-align: center;">Elige avatar y escribe tu nombre:</p>
                <input type="text" id="username" placeholder="TU NOMBRE..." maxlength="12">
                <div class="grid-avatares" id="zona-botones-avatar">
                    <p style="font-size: 9px; color: #888; grid-column: span 2; text-align: center;">Sincronizando con el tablero...</p>
                </div>
            </div>

            <div id="panel-juego" class="btn-grid">
                <div id="mi-avatar-control"></div>
                <p style="color: #00e676; font-size: 11px; font-weight: bold; margin: 0 0 5px 0; text-align: center;" id="mensaje-bienvenida"></p>
                <button class="btn btn-a" onclick="enviarRespuesta('A')">OPCIÓN A</button>
                <button class="btn btn-b" onclick="enviarRespuesta('B')">OPCIÓN B</button>
                <button class="btn btn-c" onclick="enviarRespuesta('C')">OPCIÓN C</button>
            </div>

            <div id="estado">🔴 Desconectado (Conectando...)</div>
        </div>
    </div>

    <script>
        // --- LÓGICA DE MOVIMIENTO Y ZOOM CON DOS DEDOS ---
        const widget = document.getElementById("widget-maestro");
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;
        let currentScale = 1; let startScale = 1; let initialDistance = 0;

        function getDistance(touches) {
            return Math.hypot(touches[0].clientX - touches[1].clientX, touches[0].clientY - touches[1].clientY);
        }

        function dragStart(e) {
            if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
            
            if (e.type === "touchstart") {
                if (e.touches.length === 2) {
                    isDragging = false;
                    initialDistance = getDistance(e.touches);
                    startScale = currentScale;
                    return;
                }
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }

            isDragging = true;
            initialLeft = widget.offsetLeft;
            initialTop = widget.offsetTop;
        }

        function drag(e) {
            if (e.type === "touchmove" && e.touches.length === 2) {
                e.preventDefault(); // Evita zoom del navegador
                let currentDistance = getDistance(e.touches);
                currentScale = startScale * (currentDistance / initialDistance);
                // Limitar el zoom entre la mitad del tamaño (0.5) y 2.5 veces más grande
                currentScale = Math.min(Math.max(0.5, currentScale), 2.5);
                widget.style.transform = `translate(-50%, -50%) scale(${currentScale})`;
                return;
            }

            if (!isDragging) return;
            e.preventDefault(); 
            let currentX, currentY;
            
            if (e.type === "touchmove") {
                currentX = e.touches[0].clientX; currentY = e.touches[0].clientY;
            } else {
                currentX = e.clientX; currentY = e.clientY;
            }

            const dx = (currentX - startX) / currentScale; // Ajusta el movimiento al nivel de zoom
            const dy = (currentY - startY) / currentScale; 

            widget.style.left = (initialLeft + dx) + 'px';
            widget.style.top = (initialTop + dy) + 'px';
        }

        function dragEnd(e) { isDragging = false; }

        widget.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);
        widget.addEventListener('touchstart', dragStart, {passive: false});
        document.addEventListener('touchmove', drag, {passive: false});
        document.addEventListener('touchend', dragEnd);


        // --- LÓGICA DE WEBSOCKETS (Sincronización de Juego) ---
        let mapaEmojis = {}; let avatarElegidoGlobal = null; let ultimaTematicaData = {}; let cantidadJugadoresActiva = 2;
        let ws; const estadoDiv = document.getElementById('estado');

        function conectarWebSocket() {
            ws = new WebSocket(window.location.origin.replace(/^http/, 'ws'));
            
            ws.onopen = () => {
                estadoDiv.innerHTML = '🟢 Sincronizado al En Vivo';
                estadoDiv.style.color = '#00e676';
                ws.send(JSON.stringify({ tipo: 'SOLICITAR_AVATARES' }));
            };

            ws.onclose = () => {
                estadoDiv.innerHTML = '🔴 Reconectando al juego...';
                estadoDiv.style.color = '#ff1744';
                setTimeout(conectarWebSocket, 2500); 
            };

            ws.onmessage = (event) => {
                const datos = JSON.parse(event.data);

                if (datos.tipo === 'REINICIAR_JUEGO') {
                    document.getElementById('panel-juego').style.display = 'none';
                    document.getElementById('caja-pregunta').style.display = 'none';
                    document.getElementById('panel-registro').style.display = 'block';
                    document.getElementById('username').value = '';
                    avatarElegidoGlobal = null;
                    document.getElementById('estado').innerHTML = '🟢 Reiniciado. Elige avatar nuevamente.';
                    document.getElementById('estado').style.color = '#00e676';
                    if(window.timerControl) clearInterval(window.timerControl);
                    return;
                }

                if (datos.tipo === 'MOSTRAR_EN_CONTROL') {
                    if (datos.fase === 'revelar') {
                        document.getElementById('caja-pregunta').style.display = 'block';
                        document.getElementById('ctrl-pregunta').innerText = datos.pregunta;
                        document.getElementById('ctrl-opt-a').innerText = datos.opciones[0];
                        document.getElementById('ctrl-opt-b').innerText = datos.opciones[1];
                        document.getElementById('ctrl-opt-c').innerText = datos.opciones[2];
                        document.getElementById('ctrl-timer-bar').style.width = '100%';
                        document.getElementById('ctrl-timer-bar').style.background = '#00e676';
                    } else if (datos.fase === 'conteo') {
                        let tiempoRestante = datos.tiempo;
                        const barra = document.getElementById('ctrl-timer-bar');
                        if(window.timerControl) clearInterval(window.timerControl);
                        
                        window.timerControl = setInterval(() => {
                            tiempoRestante -= 0.1;
                            let porcentaje = (tiempoRestante / datos.tiempo) * 100;
                            barra.style.width = porcentaje + '%';
                            if (porcentaje < 40) barra.style.background = '#ffea00';
                            if (porcentaje < 20) barra.style.background = '#ff1744';
                            if (tiempoRestante <= 0) clearInterval(window.timerControl);
                        }, 100);
                    }
                }

                if (datos.tipo === 'OCULTAR_PREGUNTA') {
                    document.getElementById('caja-pregunta').style.display = 'none';
                    if(window.timerControl) clearInterval(window.timerControl);
                }

                if (datos.tipo === 'CAMBIO_TEMATICA') {
                    ultimaTematicaData = datos.datos;
                    if (datos.cantidadJugadores !== undefined) cantidadJugadoresActiva = datos.cantidadJugadores;
                    for(let i=1; i<=4; i++) { if(ultimaTematicaData[i]) mapaEmojis[ultimaTematicaData[i].id] = ultimaTematicaData[i].emoji; }
                    renderizarBotonesAvatares();
                    if (avatarElegidoGlobal && mapaEmojis[avatarElegidoGlobal]) document.getElementById('mi-avatar-control').innerText = mapaEmojis[avatarElegidoGlobal];
                }

                if (datos.tipo === 'ESTADO_AVATARES') {
                    const botones = document.querySelectorAll('.grid-avatares .btn-avatar');
                    botones.forEach(btn => {
                        const idBtn = btn.id.substring(4); 
                        if (datos.ocupados.includes(idBtn)) {
                            btn.disabled = true; btn.style.opacity = '0.3';
                            if (!btn.innerText.includes('OCUPADO')) btn.innerText += " (OCUPADO)";
                        } else {
                            btn.disabled = false; btn.style.opacity = '1';
                            btn.innerText = btn.innerText.replace(" (OCUPADO)", "");
                        }
                    });
                }
            };
        }

        function renderizarBotonesAvatares() {
            const contenedor = document.getElementById('zona-botones-avatar'); let html = '';
            for (let i = 1; i <= cantidadJugadoresActiva; i++) {
                const item = ultimaTematicaData[i];
                if (item) html += `<button id="btn-${item.id}" class="btn-avatar" onclick="registrarse('${item.id}')">${item.emoji} ${item.nombre.toUpperCase()}</button>`;
            }
            contenedor.innerHTML = html;
        }

        function registrarse(avatarElegido) {
            const usernameInput = document.getElementById('username').value.trim();
            if (usernameInput === "") { alert("Escribe tu nombre primero."); return; }
            avatarElegidoGlobal = avatarElegido;
            if (ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ tipo: 'SELECCION_AVATAR', usuario: usernameInput, avatar: avatarElegido }));
                document.getElementById('panel-registro').style.display = 'none';
                document.getElementById('panel-juego').style.display = 'flex';
                document.getElementById('mi-avatar-control').innerText = mapaEmojis[avatarElegido] || '👤';
                document.getElementById('mensaje-bienvenida').innerText = `¡Preparado, ${usernameInput}!`;
            }
        }

        function enviarRespuesta(opcion) {
            const usernameInput = document.getElementById('username').value.trim();
            if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ tipo: 'RESPUESTA_CHAT', usuario: usernameInput, opcion: opcion }));
        }

        conectarWebSocket(); 
    </script>
</body>
</html>
